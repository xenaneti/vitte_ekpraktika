<div class="inquiry-list">{% for inquiry in inquiries %}<a class="inquiry-item {% if current.pk == inquiry.pk %}selected{% endif %}" href="{% url destination %}?thread={{ inquiry.pk }}#conversation"><span class="status">{{ inquiry.get_status_display }}</span><strong>№ {{ inquiry.pk }} · {{ inquiry.subject }}</strong><small>{{ inquiry.name }} · {{ inquiry.created_at|date:'d.m.Y H:i' }}</small></a>{% empty %}<p class="muted">Обращений пока нет.</p>{% endfor %}</div>
